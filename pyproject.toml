[project]
name = "twitter-kol-eva"
version = "0.1.0"
description = "Twitter/X KOL quick evaluator — drop in a handle and a price, get the 6 core metrics back."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "playwright>=1.45",
    "playwright-stealth>=1.0.6",
    "python-dotenv>=1.0",
    "rich>=13.7",
]

[project.scripts]
tweval = "twitter_kol_eva.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["twitter_kol_eva"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
